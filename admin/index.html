<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Review Management | Lokesh M</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #01010b;
            --primary-color: #00a6ff;
            --primary-color-darker: #007bb5;
            --accent-color: #7000ff;
            --card-bg-color: #121212;
            --text-color: #ffffff;
            --secondary-text-color: #cccccc;
            --border-color: #2a2a2a;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 0;
        }

        /* Admin Header */
        .admin-header {
            background: var(--card-bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-header-left img {
            height: 40px;
        }

        .admin-header-left h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .admin-header-left h1 span {
            color: var(--primary-color);
        }

        .admin-header-right a {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .admin-header-right a:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Main Container */
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Stats Bar */
        .admin-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .admin-stat-card {
            flex: 1;
            min-width: 150px;
            background: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: 0.3s;
        }

        .admin-stat-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 166, 255, 0.1);
        }

        .admin-stat-card .stat-num {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
        }

        .admin-stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--secondary-text-color);
            margin-top: 0.3rem;
        }

        /* Section Title */
        .section-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-bar h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .section-bar h2 i {
            color: var(--primary-color);
            margin-right: 8px;
        }

        /* Review Cards */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .admin-review-card {
            background: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            transition: 0.3s;
            position: relative;
        }

        .admin-review-card:hover {
            border-color: rgba(0, 166, 255, 0.3);
        }

        .admin-review-card .review-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .review-body {
            flex: 1;
        }

        .review-body .review-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .review-body .review-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .review-body .review-date {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
        }

        .review-body .review-stars {
            color: #FFD700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .review-body .review-text-content {
            color: var(--secondary-text-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.8rem;
        }

        .review-body .review-service {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 166, 255, 0.1);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .review-type-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-hardcoded {
            background: rgba(46, 213, 115, 0.15);
            color: var(--success);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .badge-user {
            background: rgba(0, 166, 255, 0.15);
            color: var(--primary-color);
            border: 1px solid rgba(0, 166, 255, 0.3);
        }

        /* Actions */
        .review-actions {
            display: flex;
            gap: 8px;
            margin-top: 0.8rem;
        }

        .btn-action {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-action:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-action.btn-delete {
            border-color: rgba(255, 71, 87, 0.3);
            color: var(--danger);
        }

        .btn-action.btn-delete:hover {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--secondary-text-color);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border-color);
            margin-bottom: 1rem;
        }

        /* Edit Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-box h3 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .modal-group {
            margin-bottom: 1.2rem;
        }

        .modal-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--secondary-text-color);
            margin-bottom: 0.4rem;
        }

        .modal-group input,
        .modal-group textarea,
        .modal-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .modal-group input:focus,
        .modal-group textarea:focus,
        .modal-group select:focus {
            border-color: var(--primary-color);
        }

        .modal-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-group select option {
            background: #1a1a2e;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .modal-btns button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-save {
            background: var(--primary-color);
            color: #fff;
        }

        .btn-save:hover {
            box-shadow: 0 0 20px rgba(0, 166, 255, 0.3);
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color) !important;
            color: var(--text-color);
        }

        .btn-cancel:hover {
            border-color: var(--danger) !important;
            color: var(--danger);
        }

        /* Toast */
        .admin-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .admin-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .admin-toast.success { background: var(--success); }
        .admin-toast.error { background: var(--danger); }

        @media (max-width: 600px) {
            .admin-header { padding: 1rem; }
            .admin-container { padding: 0 1rem; }
            .admin-review-card { flex-direction: column; }
            .admin-stats { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="admin-header">
    <div class="admin-header-left">
        <img src="../logo.png" alt="Logo">
        <h1><span>Admin</span> — Review Manager</h1>
    </div>
    <div class="admin-header-right">
        <a href="../"><i class="fas fa-arrow-left"></i> Back to Site</a>
    </div>
</div>

<div class="admin-container">
    <div class="admin-stats">
        <div class="admin-stat-card">
            <div class="stat-num" id="totalReviews">0</div>
            <div class="stat-label">Total Reviews</div>
        </div>
        <div class="admin-stat-card">
            <div class="stat-num" id="avgRating">0</div>
            <div class="stat-label">Avg Rating</div>
        </div>
        <div class="admin-stat-card">
            <div class="stat-num" id="hardcodedCount">0</div>
            <div class="stat-label">Hardcoded</div>
        </div>
        <div class="admin-stat-card">
            <div class="stat-num" id="userCount">0</div>
            <div class="stat-label">User Submitted</div>
        </div>
    </div>

    <div class="section-bar">
        <h2><i class="fas fa-shield-alt"></i> Hardcoded Reviews</h2>
    </div>
    <div class="review-list" id="hardcodedList"></div>

    <br><br>

    <div class="section-bar">
        <h2><i class="fas fa-users"></i> User Submitted Reviews</h2>
    </div>
    <div class="review-list" id="userList"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h3><i class="fas fa-edit"></i> Edit Review</h3>
        <input type="hidden" id="editIndex">
        <input type="hidden" id="editType">
        <div class="modal-group">
            <label>Name</label>
            <input type="text" id="editName">
        </div>
        <div class="modal-group">
            <label>Rating</label>
            <select id="editRating">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
            </select>
        </div>
        <div class="modal-group">
            <label>Service</label>
            <select id="editService">
                <option value="Web Development with SEO">Web Development with SEO</option>
                <option value="Website Deployment">Website Deployment</option>
                <option value="Final Year Projects">Final Year Projects</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="modal-group">
            <label>Review Text</label>
            <textarea id="editText"></textarea>
        </div>
        <div class="modal-group">
            <label>Date</label>
            <input type="text" id="editDate">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveEdit()"><i class="fas fa-check"></i> Save</button>
        </div>
    </div>
</div>

<div class="admin-toast" id="adminToast"></div>

<script>
    // Hardcoded reviews (same as in index.html)
    const defaultHardcoded = [
        {
            name: "Arun Kumar",
            rating: 5,
            text: "Lokesh developed an amazing e-commerce website for my business with perfect SEO optimization. The site loads fast, looks professional, and ranks well on Google. Highly recommend his web development services!",
            service: "Web Development with SEO",
            date: "March 2026",
            avatar: "A"
        },
        {
            name: "Priya Sharma",
            rating: 5,
            text: "Got my final year project done by Lokesh - an AI-based crop disease detection system. He delivered it on time with full documentation and explanation. The project was well-structured and impressed our panel!",
            service: "Final Year Projects",
            date: "February 2026",
            avatar: "P"
        }
    ];

    function getHardcodedReviews() {
        try {
            const stored = localStorage.getItem('lokesh_hardcoded_reviews');
            if (stored) return JSON.parse(stored);
        } catch(e) {}
        return [...defaultHardcoded];
    }

    function saveHardcodedReviews(reviews) {
        localStorage.setItem('lokesh_hardcoded_reviews', JSON.stringify(reviews));
    }

    function getUserReviews() {
        try {
            return JSON.parse(localStorage.getItem('lokesh_client_reviews') || '[]');
        } catch(e) { return []; }
    }

    function saveUserReviews(reviews) {
        localStorage.setItem('lokesh_client_reviews', JSON.stringify(reviews));
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('adminToast');
        t.textContent = msg;
        t.className = 'admin-toast ' + type + ' show';
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function renderStars(rating) {
        return '<i class="fas fa-star"></i>'.repeat(rating) + '<i class="far fa-star" style="color:#555"></i>'.repeat(5 - rating);
    }

    function renderReviewCard(review, index, type) {
        const badgeClass = type === 'hardcoded' ? 'badge-hardcoded' : 'badge-user';
        const badgeText = type === 'hardcoded' ? 'Hardcoded' : 'User';

        return `
        <div class="admin-review-card">
            <span class="review-type-badge ${badgeClass}">${badgeText}</span>
            <div class="review-avatar">${review.avatar || review.name.charAt(0).toUpperCase()}</div>
            <div class="review-body">
                <div class="review-meta">
                    <span class="review-name">${review.name}</span>
                    <span class="review-date">${review.date}</span>
                </div>
                <div class="review-stars">${renderStars(review.rating)}</div>
                <div class="review-text-content">"${review.text}"</div>
                <span class="review-service"><i class="fas fa-briefcase"></i> ${review.service}</span>
                <div class="review-actions">
                    <button class="btn-action" onclick="openEdit(${index}, '${type}')"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-action btn-delete" onclick="deleteReview(${index}, '${type}')"><i class="fas fa-trash-alt"></i> Delete</button>
                </div>
            </div>
        </div>`;
    }

    function renderAll() {
        const hardcoded = getHardcodedReviews();
        const user = getUserReviews();

        // Stats
        const total = hardcoded.length + user.length;
        const allRatings = [...hardcoded, ...user].map(r => r.rating);
        const avg = total > 0 ? (allRatings.reduce((a,b) => a+b, 0) / total).toFixed(1) : '0';

        document.getElementById('totalReviews').textContent = total;
        document.getElementById('avgRating').textContent = avg;
        document.getElementById('hardcodedCount').textContent = hardcoded.length;
        document.getElementById('userCount').textContent = user.length;

        // Hardcoded list
        const hList = document.getElementById('hardcodedList');
        if (hardcoded.length === 0) {
            hList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No hardcoded reviews</p></div>';
        } else {
            hList.innerHTML = hardcoded.map((r, i) => renderReviewCard(r, i, 'hardcoded')).join('');
        }

        // User list
        const uList = document.getElementById('userList');
        if (user.length === 0) {
            uList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No user submitted reviews yet</p></div>';
        } else {
            uList.innerHTML = user.map((r, i) => renderReviewCard(r, i, 'user')).join('');
        }
    }

    function deleteReview(index, type) {
        if (!confirm('Are you sure you want to delete this review?')) return;

        if (type === 'hardcoded') {
            const reviews = getHardcodedReviews();
            reviews.splice(index, 1);
            saveHardcodedReviews(reviews);
        } else {
            const reviews = getUserReviews();
            reviews.splice(index, 1);
            saveUserReviews(reviews);
        }

        showToast('Review deleted successfully', 'error');
        renderAll();
    }

    function openEdit(index, type) {
        const reviews = type === 'hardcoded' ? getHardcodedReviews() : getUserReviews();
        const review = reviews[index];

        document.getElementById('editIndex').value = index;
        document.getElementById('editType').value = type;
        document.getElementById('editName').value = review.name;
        document.getElementById('editRating').value = review.rating;
        document.getElementById('editService').value = review.service;
        document.getElementById('editText').value = review.text;
        document.getElementById('editDate').value = review.date;

        document.getElementById('editModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    function saveEdit() {
        const index = parseInt(document.getElementById('editIndex').value);
        const type = document.getElementById('editType').value;

        const updated = {
            name: document.getElementById('editName').value.trim(),
            rating: parseInt(document.getElementById('editRating').value),
            service: document.getElementById('editService').value,
            text: document.getElementById('editText').value.trim(),
            date: document.getElementById('editDate').value.trim(),
            avatar: document.getElementById('editName').value.trim().charAt(0).toUpperCase()
        };

        if (!updated.name || !updated.text) {
            showToast('Name and review text are required', 'error');
            return;
        }

        if (type === 'hardcoded') {
            const reviews = getHardcodedReviews();
            reviews[index] = { ...reviews[index], ...updated };
            saveHardcodedReviews(reviews);
        } else {
            const reviews = getUserReviews();
            reviews[index] = { ...reviews[index], ...updated };
            saveUserReviews(reviews);
        }

        closeModal();
        showToast('Review updated successfully!', 'success');
        renderAll();
    }

    // Close modal on outside click
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // Initial render
    renderAll();
</script>

</body>
</html>
